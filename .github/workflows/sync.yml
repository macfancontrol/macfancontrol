name: Sync legacy releases
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      source:
        type: string
        default: macfancontrol/macfancontrol
permissions:
  contents: write
concurrency:
  group: legacy-releases
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Copy and verify published releases
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source || 'macfancontrol/macfancontrol' }}
        run: python3 sync.py --source "$SOURCE"
